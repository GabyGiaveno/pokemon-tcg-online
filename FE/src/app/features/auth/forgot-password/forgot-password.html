<app-auth-shell>
  <section class="auth-page">
    <header class="page-header">
      <h2>Recuperar contraseña</h2>
      <p>Ingresá tu email para restablecerla.</p>
    </header>

    <app-auth-feedback [feedback]="feedback()"></app-auth-feedback>

    <form class="auth-form" [formGroup]="form" (ngSubmit)="submit()">
      <label class="field">
        <span>Email de la cuenta</span>
        <div class="control">
          <span class="icon">@</span>
          <input type="email" formControlName="email" placeholder="tuusuario@uni.edu" />
        </div>
      </label>

      <button type="submit" class="primary-btn">Enviar enlace</button>
    </form>

    <p class="switch">
      ¿Te acordaste la contraseña?
      <a routerLink="/auth/login">Volver al login</a>
    </p>
  </section>
</app-auth-shell>
