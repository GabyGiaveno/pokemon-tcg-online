<app-auth-shell>
  <section class="auth-page">
    <header class="page-header">
      <h2>Restablecer contraseña</h2>
      <p>Ingresá tu nueva contraseña.</p>
    </header>
    <app-auth-feedback [feedback]="feedback()"></app-auth-feedback>
    @if (!invalidToken) {
      <form class="auth-form" [formGroup]="form" (ngSubmit)="submit()">
        <label class="field">
          <span>Nueva contraseña</span>
          <div class="control">
            <span class="icon">*</span>
            <input type="password" formControlName="newPassword" placeholder="••••••••" />
          </div>
        </label>
        <label class="field">
          <span>Confirmar contraseña</span>
          <div class="control">
            <span class="icon">*</span>
            <input type="password" formControlName="confirmPassword" placeholder="••••••••" />
          </div>
        </label>
        <button type="submit" class="primary-btn">Restablecer</button>
      </form>
    }
    <p class="switch">
      <a routerLink="/auth/login">Volver al inicio de sesión</a>
    </p>
  </section>
</app-auth-shell>
