<div class="strength">
  <div class="header">
    <span>Fortaleza de contraseña</span>
    <strong>{{ strength().label }}</strong>
  </div>
  <div class="bars" [class.weak]="strength().colorClass === 'weak'" [class.medium]="strength().colorClass === 'medium'" [class.strong]="strength().colorClass === 'strong'">
    @for (bar of [1, 2, 3, 4, 5]; track bar) {
      <span [class.active]="bar <= strength().score"></span>
    }
  </div>
</div>
