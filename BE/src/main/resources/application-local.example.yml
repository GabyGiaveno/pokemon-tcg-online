spring:
  datasource:
    # DB_CLOSE_DELAY=-1 mantiene la base H2 en memoria viva durante toda la vida
    # del proceso. Sin esto, al reiniciar devtools (hot reload) se cierran las
    # conexiones y H2 borra la base entera -> "Table PLAYER not found / database is empty".
    url: jdbc:h2:mem:pokemon_tcg;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      # 'update' no tira el esquema al apagar el contexto, asi sobrevive a los
      # reinicios de devtools (con create-drop el esquema se cae en cada reload).
      ddl-auto: update
    show-sql: true

  flyway:
    enabled: false

  h2:
    console:
      enabled: true
      path: /h2-console

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  jwt:
    secret: dev-secret-key-minimum-32-chars-not-for-prod
  frontend-url: http://localhost:4200

pokemon-tcg:
  api:
    key: ${POKEMON_TCG_API_KEY:}

logging:
  level:
    root: INFO
    ar.edu.utn.frc.tup.piii: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web.socket: DEBUG
