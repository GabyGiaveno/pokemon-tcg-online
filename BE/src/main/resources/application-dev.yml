spring:
  datasource:
    url: jdbc:h2:mem:pokemon_tcg;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true

  flyway:
    enabled: false

  h2:
    console:
      enabled: true
      path: /h2-console

  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  jwt:
    secret: dev-secret-key-minimum-32-chars-not-for-prod
  frontend-url: http://localhost:4200

pokemon-tcg:
  api:
    key: ${POKEMON_TCG_API_KEY:}

logging:
  level:
    root: INFO
    ar.edu.utn.frc.tup.piii: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web.socket: DEBUG
