spring:
  main:
    web-application-type: servlet

  application:
    name: pokemon-tcg

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  cache:
    type: simple

  jackson:
    default-property-inclusion: non_null

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 86400000
  frontend-url: ${FRONTEND_URL}

pokemon-tcg:
  api:
    key: ${POKEMON_TCG_API_KEY:}
    base-url: https://api.pokemontcg.io/v2

springdoc:
  packages-to-scan: ar.edu.utn.frc.tup.piii.controllers
  show-actuator: true
  swagger-ui:
    path: /swagger-ui.html
    disable-swagger-default-url: true

logging:
  level:
    root: WARN
    ar.edu.utn.frc.tup.piii: INFO
