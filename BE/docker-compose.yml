services:
  postgres:
    image: postgres:15-alpine
    container_name: pokemon-tcg-postgres
    environment:
      POSTGRES_DB: pokemon_tcg
      POSTGRES_USER: pokemon_user
      POSTGRES_PASSWORD: pokemon_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pokemon_user -d pokemon_tcg"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
